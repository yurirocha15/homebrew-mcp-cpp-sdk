name: publish-bottles

on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
      source_workflow_head_sha:
        required: true
        type: string
      provider_control_sha:
        required: true
        type: string
      github_release_id:
        required: true
        type: string
      source_workflow_run_id:
        required: true
        type: string
      release_manifest_sha256:
        required: true
        type: string
      request_uuid:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-publishing
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    name: verify immutable source and provider control
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      source_tag: ${{ steps.input.outputs.source_tag }}
      source_commit_sha: ${{ steps.input.outputs.source_commit_sha }}
      source_workflow_head_sha: ${{ steps.input.outputs.source_workflow_head_sha }}
      provider_control_sha: ${{ steps.input.outputs.provider_control_sha }}
      github_release_id: ${{ steps.input.outputs.github_release_id }}
      source_workflow_run_id: ${{ steps.input.outputs.source_workflow_run_id }}
      release_manifest_sha256: ${{ steps.input.outputs.release_manifest_sha256 }}
      request_uuid: ${{ steps.input.outputs.request_uuid }}
    steps:
      - name: Fail closed unless executing the immutable provider control
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.provider_control_sha }}
        run: |
          test "${GITHUB_REF}" = refs/tags/release-control-v3
          test "${GITHUB_SHA}" = "${EXPECTED_CONTROL_SHA}"
          test "${GITHUB_WORKFLOW_REF}" = \
            yurirocha15/homebrew-mcp-cpp-sdk/.github/workflows/publish-bottles.yml@refs/tags/release-control-v3
      - name: Checkout only the immutable provider control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact dispatch and execution context
        id: input
        env:
          DISPATCH_JSON: >-
            {"source_tag":${{ toJSON(inputs.source_tag) }},"source_commit_sha":${{ toJSON(inputs.source_commit_sha) }},"source_workflow_head_sha":${{ toJSON(inputs.source_workflow_head_sha) }},"provider_control_sha":${{ toJSON(inputs.provider_control_sha) }},"github_release_id":${{ toJSON(inputs.github_release_id) }},"source_workflow_run_id":${{ toJSON(inputs.source_workflow_run_id) }},"release_manifest_sha256":${{ toJSON(inputs.release_manifest_sha256) }},"request_uuid":${{ toJSON(inputs.request_uuid) }}}
        run: python3 -I -S publisher/validate_dispatch.py
      - name: Verify exact source repository, release, and completed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_WORKFLOW_HEAD: ${{ steps.input.outputs.source_workflow_head_sha }}
          RELEASE_ID: ${{ steps.input.outputs.github_release_id }}
          SOURCE_RUN_ID: ${{ steps.input.outputs.source_workflow_run_id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_OWNER_ID: ${{ vars.SOURCE_OWNER_ID }}
        run: >-
          python3 -I -S publisher/verify_source_state.py
          --source-repository-id "${SOURCE_REPOSITORY_ID}"
          --source-owner-id "${SOURCE_OWNER_ID}"
          --source-tag "${SOURCE_TAG}"
          --source-workflow-head-sha "${SOURCE_WORKFLOW_HEAD}"
          --github-release-id "${RELEASE_ID}"
          --source-workflow-run-id "${SOURCE_RUN_ID}"
      - name: Download exact immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
        run: |
          mkdir release-assets
          gh release download "${SOURCE_TAG}" --repo yurirocha15/mcp-cpp-sdk --dir release-assets
      - name: Verify signed source bundle and embedded Homebrew control
        env:
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.input.outputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ steps.input.outputs.release_manifest_sha256 }}
          PROVIDER_CONTROL_SHA: ${{ steps.input.outputs.provider_control_sha }}
          PUBLISHER_REPOSITORY_ID: ${{ github.repository_id }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
          ARTIFACT_FINGERPRINT: ${{ vars.SOURCE_ARTIFACT_SIGNING_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S publisher/verify_source_release.py
          --directory release-assets --tag "${SOURCE_TAG}" --commit "${SOURCE_SHA}"
          --manifest-sha256 "${MANIFEST_SHA256}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_FINGERPRINT}"
          --provider-control-sha "${PROVIDER_CONTROL_SHA}"
          --publisher-repository-id "${PUBLISHER_REPOSITORY_ID}"
          --formula-output verified-formula/mcp-cpp-sdk.rb
      - name: Verify signed annotated source tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.input.outputs.source_commit_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/source-gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import release-assets/release-signing-key.asc
          git init --bare source.git
          git -C source.git fetch --no-tags --depth=1 https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          git -C source.git fetch --no-tags https://github.com/yurirocha15/mcp-cpp-sdk.git \
            refs/heads/main:refs/heads/main
          test "$(git -C source.git cat-file -t "${SOURCE_TAG}")" = tag
          git -C source.git verify-tag --raw "${SOURCE_TAG}" 2>tag.status
          test "$(git -C source.git rev-list -n1 "${SOURCE_TAG}")" = "${SOURCE_SHA}"
          git -C source.git merge-base --is-ancestor "${SOURCE_SHA}" refs/heads/main
          python3 -I -S publisher/verify_git_status.py \
            tag.status "${TAG_FINGERPRINT}" "${PRIMARY_FINGERPRINT}"
      - name: Upload verified formula only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-formula
          path: verified-formula/mcp-cpp-sdk.rb
          if-no-files-found: error
          retention-days: 7

  bottle:
    name: bottle (${{ matrix.tag }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            tag: sequoia
          - runner: macos-15
            tag: arm64_sequoia
          - runner: ubuntu-24.04
            tag: x86_64_linux
          - runner: ubuntu-24.04-arm
            tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download only the source-signed verified formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-formula
          path: Formula
      - name: Put the preinstalled Linuxbrew on PATH
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"
          echo /home/linuxbrew/.linuxbrew/sbin >>"${GITHUB_PATH}"
      - name: Create and trust the local tap holding the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          command -v brew
          brew tap-new --no-git yurirocha15/mcp-cpp-sdk
          tap_dir="$(brew --repository yurirocha15/mcp-cpp-sdk)"
          mkdir -p "${tap_dir}/Formula"
          cp Formula/mcp-cpp-sdk.rb "${tap_dir}/Formula/mcp-cpp-sdk.rb"
          # Homebrew 7 refuses to load formulae from untrusted taps.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap yurirocha15/mcp-cpp-sdk
          fi
      - name: Build and test static and shared consumers
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          BOTTLE_TAG: ${{ matrix.tag }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          brew install --build-bottle yurirocha15/mcp-cpp-sdk/mcp-cpp-sdk
          brew test yurirocha15/mcp-cpp-sdk/mcp-cpp-sdk
          brew bottle --json --root-url=https://ghcr.io/v2/yurirocha15/mcp-cpp-sdk yurirocha15/mcp-cpp-sdk/mcp-cpp-sdk
          mkdir bundle
          bottle_count="$(find . -maxdepth 1 -name 'mcp-cpp-sdk--*.bottle*.tar.gz' -print | wc -l)"
          metadata_count="$(find . -maxdepth 1 -name 'mcp-cpp-sdk--*.bottle.json' -print | wc -l)"
          test "${bottle_count}" = 1 && test "${metadata_count}" = 1
          bottle="$(find . -maxdepth 1 -name 'mcp-cpp-sdk--*.bottle*.tar.gz' -print -quit)"
          metadata="$(find . -maxdepth 1 -name 'mcp-cpp-sdk--*.bottle.json' -print -quit)"
          cp "${bottle}" "${metadata}" Formula/mcp-cpp-sdk.rb bundle/
          # The $ names below are jq variables, not shell variables.
          # shellcheck disable=SC2016
          jq -cn \
            --arg run_id "${RUN_ID}" --arg run_attempt "${RUN_ATTEMPT}" \
            --arg bottle_tag "${BOTTLE_TAG}" \
            --arg bottle_file "$(basename "${bottle}")" \
            --arg bottle_sha256 "$(shasum -a 256 "${bottle}" | awk '{print $1}')" \
            --arg json_file "$(basename "${metadata}")" \
            --arg json_sha256 "$(shasum -a 256 "${metadata}" | awk '{print $1}')" \
            '{schema_version:1,$run_id,$run_attempt,$bottle_tag,$bottle_file,$bottle_sha256,$json_file,$json_sha256}' \
            >bundle/handoff.json
      - name: Upload same-run bottle handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.tag }}
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    name: assemble digest-bound publication bundle
    needs: [verify, bottle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout only the immutable handoff verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download only this run's bottle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          path: bottles
      - name: Put the preinstalled Linuxbrew on PATH
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"
          echo /home/linuxbrew/.linuxbrew/sbin >>"${GITHUB_PATH}"
      - name: Verify handoffs
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I -S publisher/verify_handoffs.py --directory bottles \
            --run-id "${RUN_ID}" --run-attempt "${RUN_ATTEMPT}" \
            --expected-tag sequoia --expected-tag arm64_sequoia \
            --expected-tag x86_64_linux --expected-tag arm64_linux \
            --output bottle-ledger.json
          test "$(find bottles -name mcp-cpp-sdk.rb -print0 | xargs -0 sha256sum | cut -d' ' -f1 | sort -u | wc -l)" = 1
          mkdir -p Formula
          cp "$(find bottles -name mcp-cpp-sdk.rb -print -quit)" Formula/mcp-cpp-sdk.rb
      - name: Create and trust the local tap holding the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          command -v brew
          brew tap-new --no-git yurirocha15/mcp-cpp-sdk
          tap_dir="$(brew --repository yurirocha15/mcp-cpp-sdk)"
          mkdir -p "${tap_dir}/Formula"
          cp Formula/mcp-cpp-sdk.rb "${tap_dir}/Formula/mcp-cpp-sdk.rb"
          # Homebrew 7 refuses to load formulae from untrusted taps.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap yurirocha15/mcp-cpp-sdk
          fi
      - name: Merge exact bottle blocks and build the publication bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          mkdir publication
          cp bottle-ledger.json bottles/*/*.bottle.json bottles/*/*.bottle*.tar.gz publication/
          # The merge writes the bottle block into the tap's copy of the formula.
          brew bottle --merge --write --no-commit bottles/*/*.bottle.json
          tap_dir="$(brew --repository yurirocha15/mcp-cpp-sdk)"
          cp "${tap_dir}/Formula/mcp-cpp-sdk.rb" publication/mcp-cpp-sdk.rb
          grep -Fq '  bottle do' publication/mcp-cpp-sdk.rb
          for tag in sequoia arm64_sequoia x86_64_linux arm64_linux; do
            test "$(grep -Ec "^    sha256 .*\b${tag}: +\"[0-9a-f]{64}\"" publication/mcp-cpp-sdk.rb)" = 1
          done
          # Plain file names, without a directory prefix and without SHA256SUMS itself.
          sums="$(cd publication && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort | xargs sha256sum)"
          printf '%s\n' "${sums}" >publication/SHA256SUMS
      - name: Upload same-run publication bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-bundle
          path: publication/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: idempotently upload bottles and create formula PR
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: homebrew-publish
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      formula_pr_number: ${{ steps.publish.outputs.formula_pr_number }}
      formula_head_sha: ${{ steps.publish.outputs.formula_head_sha }}
    steps:
      - name: Checkout only the immutable publisher implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download only this run's verified publication bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-bundle
          path: publication
      - name: Put the preinstalled Linuxbrew on PATH
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >>"${GITHUB_PATH}"
          echo /home/linuxbrew/.linuxbrew/sbin >>"${GITHUB_PATH}"
      - name: Create and trust the local tap holding the bottled formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          command -v brew
          brew tap-new --no-git yurirocha15/mcp-cpp-sdk
          tap_dir="$(brew --repository yurirocha15/mcp-cpp-sdk)"
          mkdir -p "${tap_dir}/Formula"
          cp publication/mcp-cpp-sdk.rb "${tap_dir}/Formula/mcp-cpp-sdk.rb"
          # Homebrew 7 refuses to load formulae from untrusted taps.
          if brew trust --help >/dev/null 2>&1; then
            brew trust --tap yurirocha15/mcp-cpp-sdk
          fi
      - name: Create repository-scoped publisher App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: yurirocha15
          repositories: homebrew-mcp-cpp-sdk
          permission-contents: write
          permission-pull-requests: write
      - name: Publish or prove an exact existing publication
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          SOURCE_TAG: ${{ needs.verify.outputs.source_tag }}
          REQUEST_UUID: ${{ needs.verify.outputs.request_uuid }}
          MANIFEST_SHA256: ${{ needs.verify.outputs.release_manifest_sha256 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -I -S publisher/homebrew_publish.py publish
          --directory publication --source-tag "${SOURCE_TAG}"
          --request-uuid "${REQUEST_UUID}" --manifest-sha256 "${MANIFEST_SHA256}"
          --run-id "${RUN_ID}" --run-attempt "${RUN_ATTEMPT}"
          --output finalization-ledger.json
      - name: Retain exact finalization evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finalization-ledger
          path: finalization-ledger.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: verify public bottles and merge the exact formula PR
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-finalize
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout only the immutable finalizer implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download only this run's finalization ledger
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: finalization-ledger
          path: finalization
      - name: Verify required formula checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.publish.outputs.formula_pr_number }}
        run: gh pr checks "${PR}" --repo yurirocha15/homebrew-mcp-cpp-sdk --required
      - name: Create repository-scoped finalizer App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: yurirocha15
          repositories: homebrew-mcp-cpp-sdk
          permission-contents: write
          permission-pull-requests: write
      - name: Verify public GHCR content and merge or prove completion
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python3 -I -S publisher/homebrew_publish.py finalize
          --ledger finalization/finalization-ledger.json
